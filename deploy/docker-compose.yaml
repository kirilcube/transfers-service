services:
  postgres:
    image: postgres:18.6-alpine
    command:
      - "postgres"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_USER: kiril
      POSTGRES_PASSWORD: hi_sumup
      POSTGRES_DB: transfers
    ports:
      - "5432:5432"
    volumes:
      - ../migrations/001_init.up.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d transfers"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '1024M'

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '1024M'

volumes:
  postgres_data:
